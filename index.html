<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Timetable</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 10px #ddd;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .timetable {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 10px #ddd;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            min-width: 130px;
        }

        th {
            background: #222;
            color: white;
        }

        td {
            height: 80px;
        }

        .subject {
            font-weight: bold;
        }

        .delete-btn {
            background: #d9534f;
            padding: 5px 8px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            input, select, button {
                width: 100%;
                margin: 5px 0;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Smart Timetable</h1>
    <p>Plan your weekly classes easily</p>
</header>

<div class="container">

    <div class="form-box">

        <h2>Add Class</h2>
        <br>

        <select id="day">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
        </select>

        <input type="time" id="time">

        <input type="text" id="subject"
               placeholder="Subject Name">

        <input type="text" id="room"
               placeholder="Room No">

        <button onclick="addClass()">Add Class</button>

    </div>


    <div class="timetable">

        <table>

            <thead>
                <tr>
                    <th>Time</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                    <th>Saturday</th>
                </tr>
            </thead>

            <tbody id="tableBody">

                <tr>
                    <td>09:00 AM</td>
                    <td id="Monday-09:00"></td>
                    <td id="Tuesday-09:00"></td>
                    <td id="Wednesday-09:00"></td>
                    <td id="Thursday-09:00"></td>
                    <td id="Friday-09:00"></td>
                    <td id="Saturday-09:00"></td>
                </tr>

                <tr>
                    <td>10:00 AM</td>
                    <td id="Monday-10:00"></td>
                    <td id="Tuesday-10:00"></td>
                    <td id="Wednesday-10:00"></td>
                    <td id="Thursday-10:00"></td>
                    <td id="Friday-10:00"></td>
                    <td id="Saturday-10:00"></td>
                </tr>

                <tr>
                    <td>11:00 AM</td>
                    <td id="Monday-11:00"></td>
                    <td id="Tuesday-11:00"></td>
                    <td id="Wednesday-11:00"></td>
                    <td id="Thursday-11:00"></td>
                    <td id="Friday-11:00"></td>
                    <td id="Saturday-11:00"></td>
                </tr>

                <tr>
                    <td>12:00 PM</td>
                    <td id="Monday-12:00"></td>
                    <td id="Tuesday-12:00"></td>
                    <td id="Wednesday-12:00"></td>
                    <td id="Thursday-12:00"></td>
                    <td id="Friday-12:00"></td>
                    <td id="Saturday-12:00"></td>
                </tr>

                <tr>
                    <td>02:00 PM</td>
                    <td id="Monday-14:00"></td>
                    <td id="Tuesday-14:00"></td>
                    <td id="Wednesday-14:00"></td>
                    <td id="Thursday-14:00"></td>
                    <td id="Friday-14:00"></td>
                    <td id="Saturday-14:00"></td>
                </tr>

                <tr>
                    <td>03:00 PM</td>
                    <td id="Monday-15:00"></td>
                    <td id="Tuesday-15:00"></td>
                    <td id="Wednesday-15:00"></td>
                    <td id="Thursday-15:00"></td>
                    <td id="Friday-15:00"></td>
                    <td id="Saturday-15:00"></td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

function addClass() {

    let day = document.getElementById("day").value;
    let time = document.getElementById("time").value;
    let subject = document.getElementById("subject").value;
    let room = document.getElementById("room").value;

    if (day === "" || time === "" || subject === "") {
        alert("Please fill all required details!");
        return;
    }

    let cellId = day + "-" + time;
    let cell = document.getElementById(cellId);

    if (!cell) {
        alert("Please select a timetable time such as 09:00, 10:00 etc.");
        return;
    }

    cell.innerHTML = `
        <div class="subject">${subject}</div>
        <div>${room}</div>
        <button class="delete-btn"
                onclick="deleteClass('${cellId}')">
                Delete
        </button>
    `;

    document.getElementById("subject").value = "";
    document.getElementById("room").value = "";
    document.getElementById("time").value = "";
}


function deleteClass(cellId) {

    document.getElementById(cellId).innerHTML = "";

}

</script>

</body>
</html>
